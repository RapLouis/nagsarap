name: ccis_attendance
description: "CCIS Attendance System mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1

  # API
  dio: ^5.11.1

  # Authentication / token storage
  flutter_secure_storage: ^11.0.0

  # Local / offline storage
  shared_preferences: ^2.5.5

  # Network
  connectivity_plus: ^7.3.1

  # Location / geofencing
  geolocator: ^14.0.3
  permission_handler: ^13.0.2

  # Camera / images
  camera: ^0.12.1
  image_picker: ^1.2.3

  # Form 5 PDF selection
  file_selector: ^1.1.0

  # Maps
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0

  # Existing Laravel / React biometric verification
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true