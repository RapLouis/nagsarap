name: attend
description: "Attend - CCIS Attendance System mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Native High-Speed Image Compression
  flutter_image_compress: ^2.3.0

  # Background Tasks
  workmanager: ^0.6.0

  # API
  dio: ^5.11.1

  # Authentication
  flutter_secure_storage: ^11.0.0

  # Offline / Local Storage
  shared_preferences: ^2.5.5

  # On-Device Offline Head-Turn & Face Verification
  google_mlkit_face_detection: ^0.13.1

  # Network
  connectivity_plus: ^7.3.1

  # Location / Geofencing
  geolocator: ^14.0.3
  permission_handler: ^13.0.2

  # Camera / Images
  camera: ^0.12.1
  image_picker: ^1.2.3
  image: ^4.5.2

  # File Picker
  file_selector: ^1.1.0

  # Native Mobile Map
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0

  # UI & Storage Paths
  google_fonts: ^8.2.1
  path_provider: ^2.1.6
  flutter_easyloading: ^3.0.5
  screen_brightness: ^2.1.12

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/screens/images/logo.jpeg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/screens/images/logo.jpeg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - lib/screens/images/logo.jpeg